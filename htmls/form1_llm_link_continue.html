<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Onboarding</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 30px; }
        .container { background: white; width: 400px; margin: auto; padding: 25px; border-radius: 8px; }
        label { display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 9px; margin-top: 5px; box-sizing: border-box; }
        #regFlowPrimary {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #successBanner { color: green; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Staff Onboarding</h2>
    <p style="color:#64748b;font-size:14px;">Use the blue link to finish — there is no Submit label.</p>

    <form id="empRegistrationForm">
        <label for="empFullName">Full Name</label>
        <input type="text" id="empFullName" name="empFullName" placeholder="Enter your name">

        <label for="empEmail">Email</label>
        <input type="email" id="empEmail" name="empEmail" placeholder="Enter email">

        <label for="empDepartment">Department</label>
        <select id="empDepartment" name="empDepartment">
            <option value="">Select Department</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
        </select>

        <label>Employment Type</label>
        <input type="radio" id="empPermanent" name="empEmployment" value="Permanent" style="width:auto">
        <label for="empPermanent" style="display:inline">Permanent</label>

        <input type="radio" id="empContract" name="empEmployment" value="Contract" style="width:auto">
        <label for="empContract" style="display:inline">Contract</label>

        <div style="margin-top:15px">
            <input type="checkbox" id="empTerms" style="width:auto">
            <label for="empTerms" style="display:inline">I accept the terms</label>
        </div>

        <button type="submit" hidden aria-hidden="true">Submit</button>

        <a href="#" id="regFlowPrimary" role="button">Continue</a>
    </form>

    <div id="successBanner"></div>
</div>
<script>
    document.getElementById("regFlowPrimary").addEventListener("click", function (event) {
        event.preventDefault();
        document.getElementById("successBanner").innerText = "Employee registered successfully!";
    });
</script>
</body>
</html>
