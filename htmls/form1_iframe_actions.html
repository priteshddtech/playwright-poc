<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Actions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background: #f8fafc;
        }
        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <p style="margin-top:0;color:#475569;font-size:14px;">Actions panel</p>
    <button type="button" id="iframeRegisterBtn" data-testid="iframe-complete-btn">
        Complete Registration
    </button>
    <script>
        document.getElementById("iframeRegisterBtn").addEventListener("click", function () {
            window.parent.postMessage({ type: "employee-form-submit" }, "*");
        });
    </script>
</body>
</html>
